# Publica CIFRA cifrada con la contraseña guardada en el secreto APP_PASSWORD.
# El resultado se sube a la rama gh-pages, que GitHub Pages sirve como web.
name: Publicar CIFRA

on:
  push:
    branches: [claude/tender-thompson-p0zfhm]
    paths: ['cifrador/**', '.github/workflows/cifra-pages.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cifra-pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cifrador
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cifrador/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Comprobar que existe la contraseña
        env:
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
        run: |
          if [ -z "$APP_PASSWORD" ]; then
            echo "::error::Falta el secreto APP_PASSWORD. Créalo en Settings > Secrets and variables > Actions y vuelve a ejecutar."
            exit 1
          fi
      - name: Construir y cifrar
        env:
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
        run: npm run protect
      - name: Subir a la rama gh-pages
        working-directory: cifrador/dist-protected
        run: |
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publicar CIFRA (${GITHUB_SHA::7})"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
